name: MacDroid
options:
  bundleIdPrefix: dev.macdroid
  deploymentTarget:
    macOS: "14.0"
packages:
  MacDroidCore:
    path: MacDroidCore
targets:
  MacDroid:
    type: application
    platform: macOS
    sources: [MacDroid]
    dependencies:
      - package: MacDroidCore
    info:
      path: MacDroid/Info.plist
      properties:
        CFBundleDisplayName: Unison
        CFBundleShortVersionString: "0.4.2"
        CFBundleVersion: "6"
        LSUIElement: true
        NSLocalNetworkUsageDescription: Unison connects to your Android phone over your local network.
        NSBonjourServices: [_macdroid._tcp]
        CFBundleURLTypes:
          - CFBundleURLName: dev.macdroid.mac.tel
            CFBundleURLSchemes: [tel]
        NSServices:
          - NSMenuItem:
              default: Open on Phone
            NSMessage: openOnPhone
            NSPortName: Unison
            NSSendTypes:
              - public.utf8-plain-text
              - public.url
            NSRequiredContext: {}
    entitlements:
      path: MacDroid/MacDroid.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.server: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.macdroid.mac
        # The product is called Unison (renamed 2026-10-21); the bundle id, target and folders keep the old name.
        PRODUCT_NAME: Unison
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        # A stable self-signed identity (scripts/make-signing-cert.sh), not ad-hoc: keychain access survives rebuilds and updates.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "MacDroid Self-Signed"
        ENABLE_HARDENED_RUNTIME: YES
